<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emalawi19 Admin</title>
<style>
  body {
    background-color: #4b3621;
    color: #f5e9da;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #f5e9da;
  }
  .form-box {
    max-width: 400px;
    margin: 0 auto;
    background-color: #5c4033;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.5);
  }
  label {
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
    font-size: 14px;
  }
  input, textarea, select {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: none;
    box-sizing: border-box;
    font-size: 14px;
  }
  textarea {
    resize: vertical;
    min-height: 60px;
  }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 12px;
    background-color: #a9744f;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 15px;
  }
  button:active {
    background-color: #8a5d3b;
  }
  #status {
    margin-top: 12px;
    font-size: 13px;
    text-align: center;
    white-space: pre-wrap;
  }
  .hint {
    font-size: 11px;
    color: #d8c3a5;
    margin-top: 3px;
  }
</style>
</head>
<body>

<h1>Emalawi19 — Add New App</h1>

<div class="form-box">
  <form id="upload-form">
    <label>Hugging Face Write Token</label>
    <input type="password" id="hf-token" required>
    <div class="hint">Get this from huggingface.co → Settings → Access Tokens</div>

    <label>App Name</label>
    <input type="text" id="app-name" required>

    <label>Description</label>
    <textarea id="app-description" required></textarea>

    <label>Category</label>
    <input type="text" id="app-category" placeholder="e.g. Utilities, Games" required>

    <label>App Icon / Picture</label>
    <input type="file" id="app-image" accept="image/*" required>

    <label>YouTube Video Link (optional)</label>
    <input type="url" id="app-youtube" placeholder="https://youtube.com/...">

    <label>APK File</label>
    <input type="file" id="app-apk" accept=".apk" required>

    <button type="submit">Upload to Hugging Face</button>
  </form>
  <div id="status"></div>
</div>

<script>
  const HF_REPO = "Emalawi19/app-store-files";

  async function uploadFileToHF(file, token, statusEl) {
    const url = `https://huggingface.co/api/datasets/${HF_REPO}/upload/main/${encodeURIComponent(file.name)}`;
    const arrayBuffer = await file.arrayBuffer();
    const res = await fetch(url, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/octet-stream"
      },
      body: arrayBuffer
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`Upload failed for ${file.name}: ${res.status} ${text}`);
    }
    return `https://huggingface.co/datasets/${HF_REPO}/resolve/main/${encodeURIComponent(file.name)}`;
  }

  document.getElementById('upload-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const statusEl = document.getElementById('status');
    const token = document.getElementById('hf-token').value.trim();
    const imageFile = document.getElementById('app-image').files[0];
    const apkFile = document.getElementById('app-apk').files[0];

    try {
      statusEl.innerText = "Uploading image...";
      const imageUrl = await uploadFileToHF(imageFile, token, statusEl);

      statusEl.innerText = "Uploading APK...";
      const apkUrl = await uploadFileToHF(apkFile, token, statusEl);

      statusEl.innerText = `Done!\nImage: ${imageUrl}\nAPK: ${apkUrl}\n\n(Next step will save this into apps.json automatically)`;
    } catch (err) {
      statusEl.innerText = "Error: " + err.message;
    }
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My App Store</title>
<style>
  body {
    background-color: #4b3621;
    color: #f5e9da;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }
  header {
    background-color: #6f4e37;
    padding: 20px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .app-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 30px;
  }
  .app-card {
    background-color: #5c4033;
    border-radius: 12px;
    padding: 20px;
    width: 220px;
    text-align: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.5);
  }
  .app-card img {
    width: 80px;
    height: 80px;
    border-radius: 16px;
    margin-bottom: 10px;
  }
  .app-name {
    font-size: 18px;
    margin-bottom: 5px;
  }
  .download-btn {
    display: inline-block;
    margin-top: 10px;
    background-color: #a9744f;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
  }
  .download-btn:active {
    background-color: #8a5d3b;
  }
  .install-note {
    margin-top: 10px;
    font-size: 12px;
    color: #d8c3a5;
    line-height: 1.4;
  }
</style>
</head>
<body>

<header>My App Store</header>

<div class="app-grid">

  <div class="app-card">
    <img src="https://via.placeholder.com/80" alt="App Icon">
    <div class="app-name">Your App Name</div>
    <a class="download-btn" href="https://huggingface.co/datasets/Emalawi19/app-store-files/resolve/main/yourapp.apk" download>Download</a>
    <div class="install-note">After downloading, tap the file to install. Allow "install unknown apps" if prompted.</div>
  </div>

</div>

</body>
</html>
